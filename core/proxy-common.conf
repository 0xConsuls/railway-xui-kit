# =============================================================================
# proxy-common.conf — included by every proxied location (panel, subscription,
# inbounds). Installed to /etc/nginx/snippets/proxy-common.conf.
# =============================================================================

proxy_http_version 1.1;

# WebSocket / HTTP-upgrade support (panel live updates, ws and httpupgrade inbounds).
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $client_real_ip;
proxy_set_header X-Forwarded-For   $client_real_ip;
proxy_set_header X-Forwarded-Proto $forwarded_proto;

# Stream both directions without buffering. Required for xhttp (stream-up /
# stream-one) and it lowers latency for every other transport as well.
proxy_buffering         off;
proxy_request_buffering off;
